<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Planify Verification</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      font-family: Arial, sans-serif;
    }

    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 24px;
      text-align: center;
      color: white;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
    }

    h1 {
      color: #4ade80;
      margin-bottom: 15px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Email Verified ✅</h1>

    <p>
      Your Planify account has been successfully verified.
      You can now return to the app and continue setup.
    </p>
  </div>

</body>
</html>
